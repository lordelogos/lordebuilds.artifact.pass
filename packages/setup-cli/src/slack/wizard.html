<body>
  <div class="shell">
    <header class="top">
      <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M14 5h36l9 9v19h-8.7l-8-6.5H23.4L15 20H5v-6zM5 27h8.7l8 6.5h19L49 40h10v10l-9 9H14l-9-9z"/></svg>ArtifactPass <small>/ Slack archive</small></div>
      <div class="top-right"><span class="local">Local setup</span><button class="text-btn" id="exit-top" type="button">Save and exit</button></div>
    </header>
    <main class="layout">
      <div class="setup-heading"><h1>Set up Slack archive</h1><p>Progress saves automatically</p></div>
      <nav class="rail" id="rail" aria-label="Setup steps"></nav>
      <section class="card" id="card" aria-live="polite"></section>
    </main>
    <footer class="page-footer"><span>ArtifactPass</span><span>The bot runs in your Cloudflare account. Copied files stay in your Slack workspace.</span></footer>
  </div>
  <script>
    (()=>{
      const token=location.hash.slice(1);const labels=['Choose sources','Cloudflare account','Approve resources','Slack app','Connect Slack','Private origin','Channels','Add app to channels','Verify','Ready'];
      let config=null,manifestReady=false,operation=null,accounts=[],accountsChecked=false,accountsChecking=false,accountError='',step=0,renderedStep=-1,includePrivate=false,accountId='',privateOrigin='',appId='',channelsText='',joinedChannels=[],approved=false,resetApproved=false,appInstalled=false,manifestCopied=false,inspected=false,verification=null,manifest=null,error='',notice='',busy=false,busyAction='',exited=false;
      const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const api=async(path,method='GET',body)=>{const response=await fetch('/api/'+path,{method,headers:{'X-ArtifactPass-Setup-Token':token,...(body===undefined?{}:{'Content-Type':'application/json'})},...(body===undefined?{}:{body:JSON.stringify(body)})});const data=await response.json();if(!response.ok)throw Error(data.error||'Setup could not continue');return data};

      const showBusy=target=>{const buttons=[...$('card').querySelectorAll('button[data-action],button[data-back]'),...$('rail').querySelectorAll('button[data-step]'),$('exit-top')];const previous=buttons.map(button=>[button,button.disabled]);for(const button of buttons)button.disabled=true;target.classList.add('loading');target.setAttribute('aria-busy','true');target.insertAdjacentHTML('beforeend','<span class="spinner" aria-hidden="true"></span>');return()=>{for(const [button,disabled] of previous)if(button.isConnected)button.disabled=disabled;if(target.isConnected){target.classList.remove('loading');target.removeAttribute('aria-busy');target.querySelector('.spinner')?.remove()}}};
      $('card').addEventListener('click',async event=>{const target=event.target.closest('[data-action],[data-back]');if(!target||busy)return;if(target.hasAttribute('data-back')){go(step===6?4:Math.max(0,step-1));return}for(const oldError of $('card').querySelectorAll('.action-error'))oldError.remove();const action=target.dataset.action;const credentials=action==='activate'?{botToken:$('bot-token').value.trim(),signingSecret:$('signing-secret').value.trim()}:undefined;busy=true;busyAction=action;const restore=showBusy(target);try{await act(action,credentials);busy=false;busyAction='';render()}catch(caught){busy=false;busyAction='';restore();error=caught.message;const status=$('operation');if(status){status.textContent=error;status.className='operation-status error'}if(!target.closest('.card-foot'))target.insertAdjacentHTML('afterend',`<span class="action-error" role="alert">${esc(error)}</span>`)}});
      $('card').addEventListener('input',event=>{const field=event.target;if(field.name==='account')accountId=field.value;if(field.id==='app-id')appId=field.value.trim();if(field.id==='private-origin')privateOrigin=field.value.trim();if(field.id==='channels')channelsText=field.value;const action=$('card').querySelector('.card-foot [data-action]');if(action){if(step===0)action.disabled=includePrivate&&!privateOrigin.trim();if(step===1)action.disabled=!accounts.some(account=>account.id===accountId);if(step===4)action.disabled=!config?.app_id&&(!appId||!$('bot-token')?.value.trim()||!$('signing-secret')?.value.trim())}if(step===6&&field.id==='channels'){const add=$('card').querySelector('[data-action="channels"]');if(add)add.disabled=!channelsText.trim()}});
      $('card').addEventListener('change',event=>{if(event.target.id==='include-private'){includePrivate=event.target.checked;render();if(includePrivate)$('private-origin')?.focus()}if(event.target.id==='approve-resources'){approved=event.target.checked;$('card').querySelector('[data-action="deploy"]').disabled=!approved}if(event.target.id==='approve-reset'){resetApproved=event.target.checked;$('card').querySelector('[data-action="reset"]').disabled=!resetApproved}if(event.target.id==='slack-app-installed'){appInstalled=event.target.checked;const action=$('card').querySelector('.card-foot [data-action]');if(action)action.disabled=!!config?.app_id?!appInstalled||!manifestCopied:!appInstalled}if(event.target.hasAttribute('data-joined-channel')){const id=event.target.dataset.joinedChannel;joinedChannels=event.target.checked?[...new Set([...joinedChannels,id])]:joinedChannels.filter(channel=>channel!==id);$('card').querySelector('.card-foot [data-action]').disabled=!channelsAcknowledged()}if(event.target.id==='inspected'){inspected=event.target.checked;$('card').querySelector('[data-action="finish"]').disabled=!verification?.verified||!inspected}});
      $('rail').addEventListener('click',event=>{const target=event.target.closest('[data-step]');if(target&&!busy&&!pending())go(Number(target.dataset.step))});
      $('exit-top').addEventListener('click',async()=>{if(busy||pending())return;const exitButton=$('exit-top');busy=true;exitButton.disabled=true;exitButton.textContent='Saving…';try{await act('exit')}catch(caught){error=caught.message;const status=$('operation');if(status){status.textContent=error;status.className='operation-status error'}}finally{busy=false;exitButton.textContent='Save and exit';exitButton.disabled=exited;if(exited)render()}});
      const resumeStep=()=>{if(config?.stage==='ready')step=9;else if(config?.app_id&&!manifestReady)step=3;else if(config?.enabled_channels?.length)step=7;else if(config?.app_id)step=6;else if(config?.worker_url)step=3;else if(config?.account_id)step=2;else step=0};
      api('state').then(result=>{config=result.configuration;manifestReady=result.manifest_ready;operation=result.operation;accounts=result.accounts||[];accountsChecked=accounts.length>0;includePrivate=(config?.sources?.length||0)>1;privateOrigin=(config?.sources||[]).filter(source=>source!=='https://artifactpass.com').join('\n');accountId=config?.account_id||(accounts.length===1?accounts[0].id:'');appId=config?.app_id||'';resumeStep();render()}).catch(caught=>{$('card').innerHTML=head(0,'Setup link unavailable','Re-run the CLI and open its latest local link.')+`<div class="card-body">${esc(caught.message)}</div>`});
      setInterval(()=>{if(pending())void refresh().catch(caught=>{error=caught.message;render()})},1200);
    })();
  </script>
</body>
