<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Connect an agent to ArtifactPass</title>
  <desc id="description">ArtifactPass opens an approval page automatically while the agent and browser display matching approval codes.</desc>
  <rect width="1200" height="720" fill="#0b0c0e"/>
  <rect x="54" y="64" width="510" height="592" rx="24" fill="#121418" stroke="#34373d" stroke-width="2"/>
  <text x="94" y="122" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#efefec">Agent</text>
  <rect x="94" y="166" width="430" height="88" rx="14" fill="#17191d"/>
  <text x="118" y="202" font-family="Arial, sans-serif" font-size="18" fill="#b8babd">You</text>
  <text x="118" y="232" font-family="Arial, sans-serif" font-size="19" fill="#efefec">Connect ArtifactPass</text>
  <rect x="94" y="280" width="430" height="260" rx="14" fill="#17191d" stroke="#34373d"/>
  <text x="118" y="324" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#efefec">ArtifactPass needs approval</text>
  <text x="118" y="363" font-family="Arial, sans-serif" font-size="17" fill="#b8babd">Approval opened in your browser.</text>
  <text x="118" y="409" font-family="Arial, sans-serif" font-size="15" fill="#797d82">If the browser does not open, the agent shows the URL.</text>
  <text x="118" y="460" font-family="Arial, sans-serif" font-size="16" fill="#797d82">Approval code</text>
  <text x="118" y="506" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="700" fill="#efefec">AP-7K4Q</text>
  <path d="M584 360h44" stroke="#716de4" stroke-width="6" stroke-linecap="round"/><path d="M618 348l16 12-16 12" fill="none" stroke="#716de4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="654" y="64" width="492" height="592" rx="24" fill="#f7f7f8"/>
  <rect x="654" y="64" width="492" height="54" rx="24" fill="#e5e7eb"/>
  <text x="682" y="98" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">Browser approval</text>
  <text x="706" y="172" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Approve ArtifactPass</text>
  <text x="706" y="218" font-family="Arial, sans-serif" font-size="17" fill="#4b5563">Confirm that this code matches your agent.</text>
  <rect x="706" y="258" width="388" height="112" rx="16" fill="#ffffff" stroke="#d1d5db"/>
  <text x="900" y="327" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" font-weight="700" fill="#111827">AP-7K4Q</text>
  <rect x="706" y="410" width="388" height="62" rx="12" fill="#111827"/>
  <text x="900" y="449" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Approve connection</text>
  <text x="706" y="526" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">Approve only a connection you started.</text>
  <text x="706" y="558" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">No token is copied into chat or the terminal.</text>
</svg>
