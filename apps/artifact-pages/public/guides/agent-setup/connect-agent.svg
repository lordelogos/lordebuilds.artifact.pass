<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Approve an ArtifactPass project</title>
  <desc id="description">The agent prints a local approval URL and the browser names the exact project folder and publishing destination.</desc>
  <rect width="1200" height="720" fill="#0b0c0e"/>
  <rect x="54" y="64" width="510" height="592" rx="24" fill="#121418" stroke="#34373d" stroke-width="2"/>
  <text x="94" y="122" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#efefec">Agent</text>
  <rect x="94" y="166" width="430" height="88" rx="14" fill="#17191d"/>
  <text x="118" y="202" font-family="Arial, sans-serif" font-size="18" fill="#b8babd">You</text>
  <text x="118" y="232" font-family="Arial, sans-serif" font-size="19" fill="#efefec">Connect ArtifactPass</text>
  <rect x="94" y="280" width="430" height="260" rx="14" fill="#17191d" stroke="#34373d"/>
  <text x="118" y="324" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#efefec">This project needs approval</text>
  <text x="118" y="363" font-family="Arial, sans-serif" font-size="17" fill="#b8babd">Review the folder and destination.</text>
  <text x="118" y="409" font-family="Arial, sans-serif" font-size="15" fill="#797d82">Open this URL in any browser profile:</text>
  <text x="118" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#efefec">http://127.0.0.1:49152/</text>
  <text x="118" y="480" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#efefec">workspace-approval?token=•••</text>
  <path d="M584 360h44" stroke="#716de4" stroke-width="6" stroke-linecap="round"/><path d="M618 348l16 12-16 12" fill="none" stroke="#716de4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="654" y="64" width="492" height="592" rx="24" fill="#f7f7f8"/>
  <rect x="654" y="64" width="492" height="54" rx="24" fill="#e5e7eb"/>
  <text x="682" y="98" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">Local ArtifactPass approval</text>
  <text x="706" y="172" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Allow this project?</text>
  <text x="706" y="218" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">FOLDER</text>
  <rect x="706" y="236" width="388" height="66" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="726" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#111827">/Users/you/project</text>
  <text x="706" y="342" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">PUBLISH TO</text>
  <rect x="706" y="360" width="388" height="66" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="726" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#111827">https://artifactpass.com</text>
  <rect x="706" y="462" width="250" height="62" rx="12" fill="#111827"/>
  <text x="831" y="501" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Allow project</text>
  <rect x="970" y="462" width="124" height="62" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="1032" y="501" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Cancel</text>
  <text x="706" y="568" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">Approval alone does not upload any file.</text>
</svg>
