<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Review DNS records for example.com</title>
  <desc id="description">A Cloudflare-style DNS review screen listing website, www, mail, and verification records.</desc>
  <rect width="1200" height="720" fill="#f7f7f8"/>
  <text x="72" y="78" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#111827">Review DNS records</text>
  <text x="72" y="118" font-family="Arial, sans-serif" font-size="20" fill="#4b5563">Compare Cloudflare with the current DNS provider for example.com.</text>
  <rect x="68" y="154" width="1064" height="86" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="94" y="190" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9a3412">Do not skip this check</text>
  <text x="94" y="218" font-family="Arial, sans-serif" font-size="18" fill="#7c2d12">Missing records can interrupt the existing website or email after activation.</text>
  <rect x="68" y="270" width="1064" height="320" rx="14" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#6b7280"><text x="92" y="310">TYPE</text><text x="250" y="310">NAME</text><text x="520" y="310">PURPOSE</text><text x="1020" y="310">CHECK</text></g>
  <g font-family="Arial, sans-serif" font-size="19" fill="#111827">
    <text x="92" y="366">A / AAAA</text><text x="250" y="366">example.com</text><text x="520" y="366">Existing website</text><text x="1030" y="366" fill="#15803d">✓</text>
    <text x="92" y="428">CNAME</text><text x="250" y="428">www</text><text x="520" y="428">Website alias</text><text x="1030" y="428" fill="#15803d">✓</text>
    <text x="92" y="490">MX</text><text x="250" y="490">example.com</text><text x="520" y="490">Email delivery</text><text x="1030" y="490" fill="#15803d">✓</text>
    <text x="92" y="552">TXT</text><text x="250" y="552">SPF / DKIM / DMARC</text><text x="520" y="552">Email and verification</text><text x="1030" y="552" fill="#15803d">✓</text>
  </g>
  <line x1="92" y1="330" x2="1108" y2="330" stroke="#e5e7eb"/><line x1="92" y1="390" x2="1108" y2="390" stroke="#e5e7eb"/><line x1="92" y1="452" x2="1108" y2="452" stroke="#e5e7eb"/><line x1="92" y1="514" x2="1108" y2="514" stroke="#e5e7eb"/>
  <rect x="814" y="620" width="318" height="62" rx="12" fill="#2563eb"/><text x="973" y="659" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">Continue after records match</text>
</svg>
