<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Configure private deployment access</title>
  <desc id="description">A terminal shows email-code login, specific email addresses, link lifetimes, and artifacts.example.com.</desc>
  <rect width="1200" height="720" fill="#0b0c0e"/><rect x="48" y="42" width="1104" height="636" rx="24" fill="#121418" stroke="#34373d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="88" y="112" font-size="21" font-weight="700" fill="#efefec">How should people sign in?</text>
    <text x="88" y="152" font-size="18" fill="#b8babd">● Email verification code</text><text x="430" y="152" font-size="18" fill="#797d82">○ Existing company login</text>
    <line x1="88" y1="184" x2="1112" y2="184" stroke="#34373d"/>
    <text x="88" y="232" font-size="21" font-weight="700" fill="#efefec">Who may publish?</text>
    <text x="88" y="272" font-size="18" fill="#797d82">○ Approved company email domains</text><text x="528" y="272" font-size="18" fill="#b8babd">● Specific email addresses</text>
    <text x="88" y="320" font-size="16" fill="#b98458">Include the administrator's own email address.</text>
    <rect x="88" y="342" width="1024" height="58" rx="10" fill="#17191d" stroke="#34373d"/>
    <text x="112" y="378" font-size="17" fill="#efefec">admin@example.com, teammate@example.net</text>
    <line x1="88" y1="430" x2="1112" y2="430" stroke="#34373d"/>
    <text x="88" y="478" font-size="21" font-weight="700" fill="#efefec">Link lifetimes</text>
    <text x="88" y="518" font-size="18" fill="#b8babd">✓ 15 min</text><text x="225" y="518" font-size="18" fill="#b8babd">✓ 30 min</text><text x="370" y="518" font-size="18" fill="#b8babd">✓ 1 hour</text><text x="520" y="518" font-size="18" fill="#b8babd">✓ 1 day</text><text x="650" y="518" font-size="18" fill="#b8babd">✓ 7 days</text>
    <text x="88" y="574" font-size="21" font-weight="700" fill="#efefec">Deployment hostname</text>
    <rect x="88" y="596" width="1024" height="54" rx="10" fill="#17191d" stroke="#557fbd"/>
    <text x="112" y="630" font-size="17" fill="#efefec">artifacts.example.com</text>
  </g>
</svg>
