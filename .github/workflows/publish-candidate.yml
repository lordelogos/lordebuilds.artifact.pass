name: Publish npm candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: artifactpass-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable candidate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: node scripts/validate-candidate-tag.mjs
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Scan every remote ref and reachable object
        run: node scripts/scan-secrets.mjs --history --fetch-remote origin
      - run: pnpm release:check
      - run: pnpm test:packed-install
      - name: Build immutable registry tarball
        run: |
          mkdir -p "$RUNNER_TEMP/artifactpass-release"
          pnpm --dir packages/setup-cli pack --pack-destination "$RUNNER_TEMP/artifactpass-release"
          test "$(find "$RUNNER_TEMP/artifactpass-release" -maxdepth 1 -name '*.tgz' | wc -l | tr -d ' ')" = "1"
      - name: Revalidate reviewed stable tip immediately before publication
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          git fetch --no-tags origin main
          node scripts/validate-candidate-tag.mjs
      - name: Publish candidate through npm trusted publishing
        run: |
          package_archive="$(find "$RUNNER_TEMP/artifactpass-release" -maxdepth 1 -name '*.tgz' -print -quit)"
          if [ "${{ github.event.repository.visibility }}" = "public" ]; then
            npm publish "$package_archive" --tag "$release_channel" --access public --provenance
          else
            npm publish "$package_archive" --tag "$release_channel" --access public
          fi
