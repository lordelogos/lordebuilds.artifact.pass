name: Publish npm candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: artifactpass-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable candidate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./packages/setup-cli/package.json').version")"
          root_version="$(node -p "require('./package.json').version")"
          plugin_version="$(node -p "require('./plugins/artifactpass/plugin-metadata.json').version")"
          test "$RELEASE_TAG" = "v$package_version"
          test "$package_version" = "$root_version"
          test "$package_version" = "$plugin_version"
          git merge-base --is-ancestor HEAD origin/main
          if [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            release_channel="rc"
          elif [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_channel="candidate"
          else
            echo "candidate publishing accepts only RC or stable versions" >&2
            exit 1
          fi
          if [ "$release_channel" = "candidate" ] && [ "${{ github.event.repository.visibility }}" != "public" ]; then
            echo "stable candidate publishing requires a public repository" >&2
            exit 1
          fi
          echo "release_channel=$release_channel" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Scan every remote ref and reachable object
        run: node scripts/scan-secrets.mjs --history --fetch-remote origin
      - run: pnpm release:check
      - run: pnpm test:packed-install
      - name: Build immutable registry tarball
        run: |
          mkdir -p "$RUNNER_TEMP/artifactpass-release"
          pnpm --dir packages/setup-cli pack --pack-destination "$RUNNER_TEMP/artifactpass-release"
          test "$(find "$RUNNER_TEMP/artifactpass-release" -maxdepth 1 -name '*.tgz' | wc -l | tr -d ' ')" = "1"
      - name: Publish candidate through npm trusted publishing
        run: |
          package_archive="$(find "$RUNNER_TEMP/artifactpass-release" -maxdepth 1 -name '*.tgz' -print -quit)"
          if [ "${{ github.event.repository.visibility }}" = "public" ]; then
            npm publish "$package_archive" --tag "$release_channel" --access public --provenance
          else
            npm publish "$package_archive" --tag "$release_channel" --access public
          fi
