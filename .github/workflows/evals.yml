name: ArtifactPass evals

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Evaluation profile
        required: true
        type: choice
        options: [smoke, generic-baseline, model-baseline, release, production]
      host:
        description: Agent A model host
        required: false
        type: choice
        options: [codex, claude]
      agent_b:
        description: Agent B model host
        required: false
        type: choice
        options: [codex, claude]
      scenario:
        description: Behavioral or handoff scenario for model baselines
        required: false
        type: choice
        options: [share-markdown, read-shared-artifact, no-share-needed, path-and-expiry, autonomous-handoff]
      trials:
        description: Approved trial count
        required: false
        default: "10"
      maximum_budget_usd:
        description: Approved maximum model budget
        required: false
        default: "40"
      production_approval_id:
        description: Required single-use production approval ID
        required: false

permissions:
  contents: read

jobs:
  deterministic:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval:deterministic

  credentialed:
    if: github.event_name == 'workflow_dispatch' && inputs.profile != 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: artifactpass-evals
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_TRIALS: ${{ inputs.trials }}
      ARTIFACTPASS_MAXIMUM_BUDGET_USD: ${{ inputs.maximum_budget_usd }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Trial preflight
        if: inputs.profile == 'smoke' || inputs.profile == 'generic-baseline' || inputs.profile == 'model-baseline' || inputs.profile == 'release'
        run: |
          case "$EVAL_TRIALS" in
            ''|*[!0-9]*) echo "trials must be an integer" >&2; exit 1 ;;
          esac
          if [ "$EVAL_TRIALS" -lt 10 ] || [ "$EVAL_TRIALS" -gt 100 ]; then
            echo "trials must be between 10 and 100" >&2
            exit 1
          fi
          case "$ARTIFACTPASS_MAXIMUM_BUDGET_USD" in
            ''|*[!0-9.]*) echo "maximum budget must be a positive number" >&2; exit 1 ;;
          esac
          node -e 'const value = Number(process.env.ARTIFACTPASS_MAXIMUM_BUDGET_USD); if (!Number.isFinite(value) || value <= 0) process.exit(1)'
          if [ "${{ inputs.profile }}" = "release" ] && [ "$EVAL_TRIALS" -ne 20 ]; then
            echo "release evidence requires exactly 20 trials" >&2
            exit 1
          fi
      - name: Smoke
        if: inputs.profile == 'smoke'
        run: pnpm eval:smoke --host "${{ inputs.host }}" --maximum-budget-usd "$ARTIFACTPASS_MAXIMUM_BUDGET_USD"
      - name: Generic baseline
        if: inputs.profile == 'generic-baseline'
        run: pnpm eval:baseline --hosts generic --trials "$EVAL_TRIALS"
      - name: Ordered model baseline
        if: inputs.profile == 'model-baseline'
        run: |
          if [ "${{ inputs.scenario }}" = "autonomous-handoff" ]; then
            pnpm eval:cohort --agent-a "${{ inputs.host }}" --agent-b "${{ inputs.agent_b }}" --scenario autonomous-handoff --profile baseline --trials "$EVAL_TRIALS" --maximum-budget-usd "$ARTIFACTPASS_MAXIMUM_BUDGET_USD"
          else
            pnpm eval:cohort --agent-a "${{ inputs.host }}" --scenario "${{ inputs.scenario }}" --profile baseline --trials "$EVAL_TRIALS" --maximum-budget-usd "$ARTIFACTPASS_MAXIMUM_BUDGET_USD"
          fi
      - name: Fresh release evidence and decision
        if: inputs.profile == 'release'
        run: pnpm eval:release:fresh -- --trials "$EVAL_TRIALS" --maximum-budget-usd "$ARTIFACTPASS_MAXIMUM_BUDGET_USD"
      - name: Upload immutable release evidence
        if: inputs.profile == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: artifactpass-release-evidence
          path: eval-results/release-evidence/
          if-no-files-found: error

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: artifactpass-production-evals
    steps:
      - name: Production remains unavailable before secret exposure
        env:
          ARTIFACTPASS_PRODUCTION_APPROVAL_ID: ${{ inputs.production_approval_id }}
        run: |
          test -n "$ARTIFACTPASS_PRODUCTION_APPROVAL_ID"
          echo "Production mutation remains fail-closed until the signed approval and replay ledger are configured."
          exit 1
